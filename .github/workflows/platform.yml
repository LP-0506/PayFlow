name: Platform acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose:
    name: Real Compose infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: SQL, Kafka, backup restore and monitoring
        run: bash ops/tests/compose-smoke.sh
      - name: Validate Prometheus and alert behavior
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/ops/monitoring:/etc/prometheus:ro" prom/prometheus:v3.8.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/ops/monitoring:/tests:ro" -w /tests prom/prometheus:v3.8.0 test rules alerts.test.yml
      - name: Evidence (no secrets)
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100
      - name: Remove containers and local volumes
        if: always()
        run: docker compose down -v --remove-orphans
  kubernetes:
    name: Real isolated rollout and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KUBECONFIG: ${{ runner.temp }}/payflow-kubeconfig
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build labelled runtime fixture (not PayFlow application)
        run: |
          bash ops/tests/build-fixture.sh
          docker build --file ops/java/Dockerfile --build-arg JAR_FILE=ops/tests/fixture-out/runtime.jar --tag payflow-runtime-fixture:ci .
          test "$(docker image inspect payflow-runtime-fixture:ci --format '{{.Config.User}}')" = 10001:10001
      - name: Install checksum-verified kind
        run: |
          python3 ops/tests/install-kind.py
          echo "$PWD/.local/bin" >> "$GITHUB_PATH"
      - name: Server validation, rollout, failed rollout, undo, security denial
        run: bash ops/tests/kind-smoke.sh
