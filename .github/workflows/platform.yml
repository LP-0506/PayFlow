name: Platform acceptance
on:
  push:
    branches: [main]
    paths: ["ops/**", "compose.yml", ".dockerignore", ".github/workflows/platform.yml"]
  pull_request:
    branches: [main]
    paths: ["ops/**", "compose.yml", ".dockerignore", ".github/workflows/platform.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose:
    name: Real Compose infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate application overlay without pretending application images exist
        env:
          ORDER_SERVICE_IMAGE: validation-only/order:unbuilt
          PAYMENT_WORKER_IMAGE: validation-only/worker:unbuilt
          MOCK_GATEWAY_IMAGE: validation-only/gateway:unbuilt
          RECONCILER_IMAGE: validation-only/reconciler:unbuilt
        run: docker compose -f compose.yml -f ops/compose/apps.yml config --quiet
      - name: SQL, Kafka, backup restore and monitoring
        run: bash ops/tests/compose-smoke.sh
      - name: Validate Prometheus and alert behavior
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/ops/monitoring:/etc/prometheus:ro" prom/prometheus:v3.8.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/ops/monitoring:/tests:ro" -w /tests prom/prometheus:v3.8.0 test rules alerts.test.yml
      - name: Capture actual provisioned dashboard
        run: |
          python3 -m venv .local/visual-venv
          .local/visual-venv/bin/pip install -r ops/tests/visual-requirements.txt
          .local/visual-venv/bin/python ops/tests/capture-dashboard.py
      - name: Preserve dashboard evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-dashboard
          path: .local/evidence/grafana-dashboard.png
          retention-days: 7
          include-hidden-files: true
      - name: Evidence (no secrets)
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100
      - name: Remove containers and local volumes
        if: always()
        run: docker compose down -v --remove-orphans
  kubernetes:
    name: Real isolated rollout and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KUBECONFIG: /tmp/payflow-isolated-kubeconfig
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build labelled runtime fixture (not PayFlow application)
        run: |
          bash ops/tests/build-fixture.sh
          docker build --file ops/java/Dockerfile --build-arg JAR_FILE=ops/tests/fixture-out/runtime.jar --tag payflow-runtime-fixture:ci .
          test "$(docker image inspect payflow-runtime-fixture:ci --format '{{.Config.User}}')" = 10001:10001
      - name: Install checksum-verified kind
        run: |
          python3 ops/tests/install-kind.py
          echo "$PWD/.local/bin" >> "$GITHUB_PATH"
      - name: Server validation, rollout, failed rollout, undo, security denial
        run: bash ops/tests/kind-smoke.sh
