name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '42 4 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  trivy:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  infrastructure-images:
    name: Third-party infrastructure findings (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: List actual infrastructure image references
        id: images
        run: docker compose config --images | sort -u > /tmp/payflow-images.txt
      - name: Install pinned scanner and verify repository dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan every exact locked upstream image (vulnerability findings do not block)
        run: |
          mkdir -p .local/raw-image-scans
          status=0
          index=0
          while IFS= read -r image; do
            index=$((index+1))
            if ! trivy image --severity HIGH,CRITICAL --ignore-unfixed --format json --output ".local/raw-image-scans/$index.json" --exit-code 0 "$image"; then
              status=1
            fi
          done < /tmp/payflow-images.txt
          python3 ops/tests/summarize-image-scans.py
          exit "$status"
      - name: Preserve sanitized vulnerability findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infrastructure-security-findings
          path: .local/evidence/infrastructure-findings.json
          retention-days: 14
          include-hidden-files: true
