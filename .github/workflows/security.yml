name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '42 4 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - id: review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
      - name: Report enforcement state
        if: steps.review.outcome == 'failure'
        run: |
          echo '::warning::Dependency review did not enforce. Until the repository owner enables the Dependency graph (Settings > Security > Code security and analysis) this action cannot run; re-run this job after enabling it so new-vulnerability gating is real.'

  trivy:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: payment-pipeline/payment-pipeline/pom.xml
      - name: Warm the local Maven repository for the scanner
        working-directory: payment-pipeline/payment-pipeline
        run: mvn -B -q dependency:go-offline
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Build output is not source; a committed target/ embeds a stale
          # pom with unpinned versions that must not fail this gate.
          skip-dirs: '**/target'
          exit-code: '1'

  infrastructure-images:
    name: Third-party infrastructure findings (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: List actual infrastructure image references
        id: images
        run: docker compose config --images | sort -u > /tmp/payflow-images.txt
      - name: Install the pinned scanner (no repository scan in this job)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.2/contrib/install.sh | sh -s -- -b /tmp/trivy-bin v0.76.2
          echo /tmp/trivy-bin >> "$GITHUB_PATH"
          /tmp/trivy-bin/trivy version
      - name: Scan every exact locked upstream image (vulnerability findings do not block)
        run: |
          mkdir -p .local/raw-image-scans
          status=0
          index=0
          while IFS= read -r image; do
            index=$((index+1))
            if ! trivy image --severity HIGH,CRITICAL --ignore-unfixed --format json --output ".local/raw-image-scans/$index.json" --exit-code 0 "$image"; then
              status=1
            fi
          done < /tmp/payflow-images.txt
          python3 ops/tests/summarize-image-scans.py
          exit "$status"
      - name: Preserve sanitized vulnerability findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-security-findings
          path: .local/evidence/infrastructure-findings.json
          retention-days: 14
          include-hidden-files: true
