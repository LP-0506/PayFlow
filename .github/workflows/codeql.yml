name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  detect:
    name: Detect Java sources
    runs-on: ubuntu-latest
    outputs:
      has_java: ${{ steps.scan.outputs.has_java }}
    steps:
      - uses: actions/checkout@v5
      - id: scan
        shell: bash
        run: |
          if find . \( -path ./.git -o -path ./ops/tests \) -prune -o -name '*.java' -print -quit | grep -q .; then
            echo "has_java=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_java=false" >> "$GITHUB_OUTPUT"
          fi

  notice:
    name: No Java sources yet
    needs: detect
    if: needs.detect.outputs.has_java == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::No Java sources in the repository yet. CodeQL analysis activates automatically when Java code lands."

  analyze:
    name: Analyze Java
    needs: detect
    if: needs.detect.outputs.has_java == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
