version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
  groups:
    weekly-github-actions:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /ops/java
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
  groups:
    weekly-docker:
      patterns:
      - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
- package-ecosystem: docker-compose
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
  groups:
    weekly-docker-compose:
      patterns:
      - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
