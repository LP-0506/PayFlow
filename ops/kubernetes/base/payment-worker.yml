apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-worker
  labels: &id001
    app.kubernetes.io/name: payment-worker
    app.kubernetes.io/part-of: payflow
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-worker
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: payflow/payment-worker:integration-required
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: payflow-runtime
        - secretRef:
            name: payflow-runtime
        env:
        - name: SPRING_APPLICATION_NAME
          value: payment-worker
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-worker
  labels:
    app.kubernetes.io/name: payment-worker
    app.kubernetes.io/part-of: payflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-worker
  ports:
  - name: http
    port: 8080
    targetPort: http
