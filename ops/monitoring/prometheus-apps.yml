global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: postgres
  static_configs:
  - targets:
    - postgres-exporter:9187
- job_name: payflow
  metrics_path: /actuator/prometheus
  static_configs:
  - targets:
    - order-service:8080
    - payment-worker:8080
    - mock-gateway:8080
    - reconciler:8080
